name: voice_to_text
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.0+7

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  permission_handler: ^11.3.1
  speech_to_text: ^7.4.0
  google_fonts: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/
